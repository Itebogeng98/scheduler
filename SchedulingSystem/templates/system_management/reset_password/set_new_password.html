<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {

            --primary: rgb(240, 158, 7);
            --primary-hover: rgb(240, 158, 7);
            --success: #2ecc71;
            --error: #e74c3c;
            --warning: #f39c12;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            background-image: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
        }
        
        .password-set-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            transition: transform 0.3s ease;
        }
        
        .password-set-container:hover {
            transform: translateY(-5px);
        }
        
        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 1.8rem;
            text-align: center;
            font-weight: 700;
            font-size: 1.8rem;
            position: relative;
            padding-bottom: 10px;
        }
        
        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--primary);
            border-radius: 3px;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        
        .form-group {
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95rem;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e0e3e7;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            margin-bottom: 0.5rem;
            box-sizing: border-box;
            padding-right: 40px;
        }
        
        input[type="password"]:focus, input[type="text"]:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #95a5a6;
            transition: color 0.3s;
        }
        
        .toggle-password:hover {
            color: var(--primary);
        }
        
        button[type="submit"] {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
        }
        
        button[type="submit"]:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        
        button[type="submit"]:active {
            transform: translateY(0);
        }
        
        .messages {
            margin-top: 1.5rem;
        }
        
        .messages p {
            padding: 0.85rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .messages p.success {
            background-color: rgba(46, 204, 113, 0.1);
            color: var(--success);
            border: 2px solid rgba(46, 204, 113, 0.2);
        }
        
        .messages p.error {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--error);
            border: 2px solid rgba(231, 76, 60, 0.2);
        }
        
        .messages p.info {
            background-color: rgba(243, 156, 18, 0.1);
            color: var(--warning);
            border: 2px solid rgba(243, 156, 18, 0.2);
        }
        
        .password-requirements {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: -0.5rem;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }
        
        .password-strength {
            height: 5px;
            background: #ecf0f1;
            border-radius: 5px;
            margin-top: 0.5rem;
            overflow: hidden;
            position: relative;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0;
            border-radius: 5px;
            transition: width 0.3s ease, background 0.3s ease;
        }
        
        .strength-0 {
            width: 20%;
            background: var(--error);
        }
        
        .strength-1 {
            width: 40%;
            background: #ff9f43;
        }
        
        .strength-2 {
            width: 60%;
            background: #feca57;
        }
        
        .strength-3 {
            width: 80%;
            background: #1dd1a1;
        }
        
        .strength-4 {
            width: 100%;
            background: var(--success);
        }
        
        .requirement-list {
            margin: 0.5rem 0 1rem;
            padding-left: 1.2rem;
        }
        
        .requirement-item {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 0.3rem;
            position: relative;
        }
        
        .requirement-item.valid {
            color: var(--success);
        }
        
        .requirement-item.valid::before {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: -1.2rem;
            color: var(--success);
        }
        
        .requirement-item.invalid::before {
            content: '\f00d';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: -1.2rem;
            color: #bdc3c7;
        }
    </style>
</head>

<body>
    <div class="password-set-container">
        <h2>Set New Password</h2>
        
        <form method="post" id="passwordResetForm">
            {% csrf_token %}
            <input type="hidden" name="token" value="{{ token }}">
            
            <div class="form-group">
                <label for="password1">New Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password1" id="password1" required autocomplete="new-password">
                    <i class="fas fa-eye toggle-password" toggle="#password1"></i>
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="password-strength-bar"></div>
                </div>
                <div class="requirement-list">
                    <div class="requirement-item invalid" id="length-req">At least 8 characters</div>
                    <div class="requirement-item invalid" id="uppercase-req">At least 1 uppercase letter</div>
                    <div class="requirement-item invalid" id="digit-req">At least 1 digit</div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password2">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password2" id="password2" required autocomplete="new-password">
                    <i class="fas fa-eye toggle-password" toggle="#password2"></i>
                </div>
                <div id="password-match" class="password-requirements" style="display:none;color:var(--error);"></div>
            </div>
            
            <button type="submit">Reset Password</button>
        </form>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <p class="{{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <script>
        $(document).ready(function() {
            // Toggle password visibility
            $(".toggle-password").click(function() {
                $(this).toggleClass("fa-eye fa-eye-slash");
                var input = $($(this).attr("toggle"));
                if (input.attr("type") == "password") {
                    input.attr("type", "text");
                } else {
                    input.attr("type", "password");
                }
            });
            
            // Password strength checker
            $("#password1").on("input", function() {
                var password = $(this).val();
                var strength = 0;
                
                // Check length
                if (password.length >= 8) {
                    strength += 1;
                    $("#length-req").addClass("valid").removeClass("invalid");
                } else {
                    $("#length-req").addClass("invalid").removeClass("valid");
                }
                
                // Check uppercase
                if (/[A-Z]/.test(password)) {
                    strength += 1;
                    $("#uppercase-req").addClass("valid").removeClass("invalid");
                } else {
                    $("#uppercase-req").addClass("invalid").removeClass("valid");
                }
                
                // Check digit
                if (/\d/.test(password)) {
                    strength += 1;
                    $("#digit-req").addClass("valid").removeClass("invalid");
                } else {
                    $("#digit-req").addClass("invalid").removeClass("valid");
                }
                
                // Check special char (bonus)
                if (/[^A-Za-z0-9]/.test(password)) {
                    strength += 1;
                }
                
                // Update strength bar
                $("#password-strength-bar").removeClass().addClass("password-strength-bar strength-" + strength);
            });
            
            // Password match checker
            $("#password2").on("input", function() {
                var password1 = $("#password1").val();
                var password2 = $(this).val();
                
                if (password2.length > 0) {
                    if (password1 === password2) {
                        $("#password-match").text("Passwords match!").css("color", "var(--success)").show();
                    } else {
                        $("#password-match").text("Passwords do not match").css("color", "var(--error)").show();
                    }
                } else {
                    $("#password-match").hide();
                }
            });
            
            // Form submission validation
            $("#passwordResetForm").submit(function(e) {
                var password1 = $("#password1").val();
                var password2 = $("#password2").val();
                var isValid = true;
                
                // Check requirements
                if (password1.length < 8) {
                    isValid = false;
                    $("#length-req").css("color", "var(--error)");
                }
                
                if (!/[A-Z]/.test(password1)) {
                    isValid = false;
                    $("#uppercase-req").css("color", "var(--error)");
                }
                
                if (!/\d/.test(password1)) {
                    isValid = false;
                    $("#digit-req").css("color", "var(--error)");
                }
                
                if (password1 !== password2) {
                    isValid = false;
                    $("#password-match").css("color", "var(--error)").text("Passwords must match").show();
                }
                
                if (!isValid) {
                    e.preventDefault();
                    $(".messages").html('<p class="error">Please fix the errors above before submitting.</p>');
                    $('html, body').animate({
                        scrollTop: 0
                    }, 500);
                }
            });
        });
    </script>
</body>
</html>
