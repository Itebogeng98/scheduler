
<h4>Delete CostSheet</h4>

<p>
    Are you sure you want to delete the CostSheet for
    <strong>{{ costsheet.client_type }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'cost_sheet_view' %}" class="btn btn-secondary">Cancel</a>
</form>
