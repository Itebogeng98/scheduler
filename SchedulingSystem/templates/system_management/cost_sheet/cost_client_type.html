<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Client Type Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <style>
        :root {
            --primary-orange: #fd7e14;
            --primary-orange-dark: #e96b00;
            --primary-orange-light: #ff9d45;
            --primary-orange-bg: #fff3e8;
        }
        
        .bg-primary {
            background-color: var(--primary-orange) !important;
        }
        
        .btn-primary {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
        }
        
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--primary-orange-dark);
            border-color: var(--primary-orange-dark);
        }
        
        .btn-success {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
        }
        
        .btn-success:hover, .btn-success:focus {
            background-color: var(--primary-orange-dark);
            border-color: var(--primary-orange-dark);
        }
        
        .form-select:focus {
            border-color: var(--primary-orange-light);
            box-shadow: 0 0 0 0.25rem rgba(253, 126, 20, 0.25);
        }
        
        .card {
            border-color: var(--primary-orange-light);
        }
        
        .card-header {
            border-bottom-color: var(--primary-orange-light);
        }
        
        .text-primary {
            color: var(--primary-orange) !important;
        }
        
        .bg-light {
            background-color: var(--primary-orange-bg) !important;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4>Please choose client type for billing</h4>
            </div>
            <div class="card-body">
                <form id="client-type-form">

                    <!-- Client Type -->
                    <div class="mb-3">
                        <label class="form-label">Client Type</label>
                        <select name="client_type" class="form-select" required>
                            <option value="">Select Client Type</option>
                            {% for ct in client_types %}
                            <option value="{{ ct.id }}">{{ ct.client_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check me-1"></i> Continue
                        </button>
                    </div>
                </form>

                <div id="message" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Font Awesome (for icons) -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function() {
            $("#client-type-form").submit(function(e) {
                e.preventDefault(); // prevent default form submission

                let clientTypeId = $("select[name='client_type']").val();

                if (!clientTypeId) {
                    $("#message").html('<p class="text-danger">Please select a client type.</p>');
                    return;
                }

                // Redirect to the billing page for the selected client type
                window.location.href = `/scheduler/client_type_cost_sheet/${clientTypeId}/`;
            });
        });
    </script>
</body>

</html>
