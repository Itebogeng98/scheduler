<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Glowing Sphere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            display: block;
        }
        
        .info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="info">Move mouse to interact</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Create glowing sphere
        const geometry = new THREE.SphereGeometry(2, 64, 64);
        
        // Custom shader material for glow effect
        const glowMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                mouseX: { value: 0 },
                mouseY: { value: 0 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                uniform float time;
                uniform float mouseX;
                uniform float mouseY;
                
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    
                    // Add subtle displacement based on time
                    vec3 pos = position;
                    pos += normal * sin(time * 2.0 + position.y * 3.0) * 0.02;
                    
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                uniform float time;
                uniform float mouseX;
                uniform float mouseY;
                
                void main() {
                    // Base color with gradient
                    vec3 color1 = vec3(0.1, 0.4, 0.9); // Blue
                    vec3 color2 = vec3(0.8, 0.2, 0.9); // Purple
                    vec3 color3 = vec3(0.1, 0.9, 0.7); // Cyan
                    
                    // Mix colors based on position and time
                    float mixFactor = sin(vPosition.y * 2.0 + time) * 0.5 + 0.5;
                    vec3 baseColor = mix(color1, color2, mixFactor);
                    baseColor = mix(baseColor, color3, sin(vPosition.x * 3.0 + time * 1.5) * 0.5 + 0.5);
                    
                    // Fresnel effect for edge glow
                    float fresnel = pow(1.0 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
                    
                    // Add glow
                    vec3 glowColor = vec3(0.3, 0.6, 1.0);
                    baseColor += glowColor * fresnel * 1.5;
                    
                    // Mouse interaction - color shift
                    baseColor.r += mouseX * 0.3;
                    baseColor.b += mouseY * 0.3;
                    
                    // Pulsing glow
                    float pulse = sin(time * 3.0) * 0.1 + 1.0;
                    baseColor *= pulse;
                    
                    gl_FragColor = vec4(baseColor, 1.0);
                }
            `,
            transparent: true
        });
        
        const sphere = new THREE.Mesh(geometry, glowMaterial);
        scene.add(sphere);
        
        // Inner core sphere
        const coreGeometry = new THREE.SphereGeometry(1.5, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({
            color: 0x4a90ff,
            transparent: true,
            opacity: 0.3
        });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(core);
        
        // Particle system for extra glow
        const particleCount = 500;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount * 3; i += 3) {
            const radius = 3 + Math.random() * 2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            positions[i] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = radius * Math.cos(phi);
        }
        
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const particleMaterial = new THREE.PointsMaterial({
            color: 0x66aaff,
            size: 0.05,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);
        
        // Mouse tracking
        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;
        
        document.addEventListener('mousemove', (event) => {
            targetMouseX = (event.clientX / window.innerWidth) * 2 - 1;
            targetMouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });
        
        // Camera position
        camera.position.z = 6;
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const time = performance.now() * 0.001;
            
            // Smooth mouse following
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;
            
            // Rotate sphere
            sphere.rotation.y += 0.005;
            sphere.rotation.x += 0.002;
            
            // Mouse-based rotation
            sphere.rotation.y += mouseX * 0.02;
            sphere.rotation.x += mouseY * 0.02;
            
            // Update shader uniforms
            glowMaterial.uniforms.time.value = time;
            glowMaterial.uniforms.mouseX.value = mouseX;
            glowMaterial.uniforms.mouseY.value = mouseY;
            
            // Rotate core
            core.rotation.y -= 0.008;
            core.rotation.z += 0.005;
            
            // Scale core with time
            const coreScale = 1 + Math.sin(time * 2) * 0.1;
            core.scale.set(coreScale, coreScale, coreScale);
            
            // Rotate particles
            particles.rotation.y += 0.002;
            particles.rotation.x += 0.001;
            
            // Camera follows mouse slightly
            camera.position.x = mouseX * 0.5;
            camera.position.y = mouseY * 0.5;
            camera.lookAt(scene.position);
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start animation
        animate();
    </script>
</body>
</html>
