{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h3 class="mb-4 text-center text-primary">Create Course</h3>

            <!-- Alerts -->
            <div id="alert-container"></div>

            <!-- Course Form -->
            <form id="course-form">
                <input type="hidden" id="vendor_id" value="{{ vendor_id }}">

                <div class="mb-3">
                    <label for="course_code" class="form-label">Course Code</label>
                    <input type="text" class="form-control" id="course_code" placeholder="Enter course code">
                </div>

                <div class="mb-3">
                    <label for="course_description" class="form-label">Description</label>
                    <textarea class="form-control" id="course_description"
                        placeholder="Enter course description"></textarea>
                </div>
                <div class="mb-3">
                    <label for="exam" class="form-label">Exam</label>
                    <select class="form-control" id="exam">
                        <option value="" selected>-- Select Exam --</option>
                        <option value="Included">Included</option>
                        <option value="Excluded">Excluded</option>
                        <option value="NA">NA</option>
                        <option value="Assessment">Assessment</option>
                        <option value="No Exam">No Exam</option>
                    </select>
                </div>


                <div class="mb-3">
                    <label for="duration" class="form-label">Duration</label>
                    <input type="text" class="form-control" id="duration" placeholder="Enter course duration">
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">Price</label>
                    <input type="number" step="0.01" class="form-control" id="price" placeholder="Enter course price">
                </div>

                <div class="mb-3">
                    <label for="is_active" class="form-label">Status</label>
                    <select class="form-control" id="is_active">
                        <option value="true">Active</option>
                        <option value="false" selected>Inactive</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Create Course</button>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#course-form").on("submit", function (e) {
                e.preventDefault();

                let vendorId = $("#vendor_id").val();
                let url = `/scheduler_api/create_course_api/${vendorId}/`;

                let payload = {
                    course_code: $("#course_code").val() || null,
                    course_description: $("#course_description").val() || null,
                    exam: $("#exam").val() || null,
                    duration: $("#duration").val() || null,
                    price: $("#price").val() || null,
                    is_active: $("#is_active").val() === "true"
                };


                $.ajax({
                    url: url,
                    type: "POST",
                    data: JSON.stringify(payload),
                    contentType: "application/json",
                    success: function (response) {
                        $("#alert-container").html(
                            `<div class="alert alert-success">✅ ${response.message}</div>`
                        );
                        $("#course-form")[0].reset();
                    },
                    error: function (xhr) {
                        let errMsg = xhr.responseJSON?.error || "Something went wrong!";
                        $("#alert-container").html(
                            `<div class="alert alert-danger">❌ ${errMsg}</div>`
                        );
                    }
                });
            });
        });
    </script>
</body>

</html>
